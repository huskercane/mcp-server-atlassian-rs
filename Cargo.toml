[package]
name         = "mcp-server-devtools"
version      = "0.15.0"
edition      = "2024"
rust-version = "1.96"
description  = "A unified Rust MCP server for developer tools and services."
license      = "ISC"
repository   = "https://github.com/huskercane/mcp-server-devtools"
readme       = "README.md"
publish      = false

[lib]
name = "mcp_server_devtools"
path = "src/lib.rs"

[[bin]]
name = "mcp-devtools"
path = "src/main.rs"

[features]
# Enabled by default for desktop builds. Disable with `--no-default-features`
# for headless Linux (CI, SSH, containers): keyring + libsecret aren't useful
# without a logged-in desktop session, and disabling avoids the libsecret
# build dep entirely.
default  = ["keychain", "wrds"]
# `wrds` activates the WRDS (Wharton Research Data Services) integration. WRDS
# has no REST API — it is a PostgreSQL database — so this is the one vendor that
# does not ride the shared `reqwest`/`Vendor` HTTP path. The feature pulls in a
# Postgres client (`tokio-postgres`) and its rustls TLS bridge
# (`tokio-postgres-rustls`); the TLS stack itself (`rustls`, `aws-lc-rs`,
# `rustls-native-certs`) is already linked via `reqwest`, so the marginal cost is
# only the Postgres wire protocol. Build `--no-default-features --features
# keychain` to drop the Postgres dependency tree entirely (headless / non-WRDS
# deployments). At runtime the connection is lazy: nothing dials WRDS until a
# `wrds_*` tool is actually called.
wrds     = ["dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:rustls", "dep:rustls-native-certs"]
# `dep:keyring` activates the optional `keyring` dep declared per-target below.
# We pick an explicit credential-store feature on each OS — without one,
# `keyring` falls back to a mock store that silently no-ops `set` and returns
# `NoEntry` on `get`.
keychain = ["dep:keyring"]

[dependencies]
rmcp                = { version = "=3.1.2", features = ["transport-io", "transport-streamable-http-server"] }
#rmcp-macros         = "=3.1.0"
tokio               = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "signal", "io-std", "fs", "sync", "time", "process"] }
axum                = "=0.8.9"
tower-http          = { version = "=0.7.0", features = ["cors", "limit"] }
tokio-util          = { version = "=0.7.19", features = ["rt", "io"] }
futures             = "=0.3.34"
serde               = { version = "=1.0.229", features = ["derive"] }
serde_json          = "=1.0.151"
tracing             = "=0.1.44"
tracing-subscriber  = { version = "=0.3.23", features = ["env-filter", "fmt", "registry", "std"] }
dotenvy             = "=0.15.7"
base64              = "=0.23.1"
# RFC 6238 TOTP for NinjaOne console logins, when an operator configures a seed
# instead of delegating to a vault CLI. `hmac`/`sha2` were already in the tree
# transitively; `sha1` is the only new crate, and it is what an `otpauth://`
# URI defaults to. Base32 is decoded in-crate (an encoding, not a primitive).
hmac                = "=0.12.1"
sha1                = "=0.10.6"
sha2                = "=0.10.9"
dirs                = "=6.0.0"
uuid                = { version = "=1.24.0", features = ["v4"] }
regex               = "=1.13.1"
reqwest             = { version = "=0.13.4", default-features = false, features = ["json", "form", "stream", "rustls", "charset", "http2", "gzip", "brotli", "deflate", "zstd"] }
async-compression   = { version = "=0.4.36", features = ["tokio", "gzip", "brotli", "deflate", "zstd"] }
url                 = "=2.5.8"
jmespath            = "=0.5.0"
# TOON output encoder. Swapped from `toon-format` 0.5.0, which treats `-` as a
# structural character (`STRUCTURAL_CHARS` in its constants.rs) and therefore
# quotes every string containing a hyphen — Jira keys, UUIDs, ISO dates, repo
# slugs, branch names. Measured against the TS reference `@toon-format/toon`
# (which agrees with this crate, not the old one, at v2/v3/v4) over a 489-case
# corpus: `toon-format` matched 401, `serde_toon_format` 449, with **zero**
# cases the old crate encoded correctly and this one gets wrong. It is also
# ~3.5x faster and allocates ~5.6x less on a 2 MB payload. `default-features`
# stays off to leave the optional `rayon` dependency out of the tree.
serde_toon_format   = { version = "=0.1.2", default-features = false }
rand                = "=0.10.2"
schemars            = "=1.2.2"
clap                = { version = "=4.6.6", features = ["derive", "env", "wrap_help"] }
atomicwrites        = "0.4.4"
rpassword           = "7"
httpdate            = "1"
zstd                = "0.13"
chrono              = { version = "=0.4.45", default-features = false, features = ["std"] }

# --- WRDS (feature = "wrds") --------------------------------------------------
# WRDS is PostgreSQL-only; these back the `wrds_*` tools. `with-serde_json-1`
# lets Postgres do all type -> JSON conversion server-side (via `to_jsonb`), so
# the client reads each result set as a single `serde_json::Value` and needs no
# per-column type mapping. TLS reuses the already-linked rustls stack:
# `rustls-native-certs` supplies the OS trust anchors; `aws-lc-rs` (rustls'
# default provider, already in the tree via reqwest) supplies the crypto.
tokio-postgres        = { version = "=0.7.18", optional = true, features = ["with-serde_json-1"] }
tokio-postgres-rustls = { version = "=0.14.0", optional = true }
rustls                = { version = "=0.23.39", optional = true }
rustls-native-certs   = { version = "=0.8.4", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.1.6", optional = true, default-features = false, features = ["apple-native-keyring-store", "v1"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4.1.6", optional = true, default-features = false, features = ["windows-native-keyring-store", "v1"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.1.6", optional = true, default-features = false, features = ["linux-keyutils-keyring-store", "v1"] }

[dev-dependencies]
tempfile            = "=3.27.0"
pretty_assertions   = "=1.4.1"
serial_test         = "=4.0.1"
wiremock            = "=0.6.5"
assert_cmd          = "=2.2.2"

# Benchmarks run under release-grade codegen, but keep the symbols a sampling
# profiler (samply, Instruments, /usr/bin/sample) needs — `release` strips them,
# which would leave every frame unresolved. LTO is off so the profiling loop
# stays fast to rebuild. Never shipped: `release` is still the artifact profile.
# Profiling harnesses, not pass/fail benchmarks — hence `harness = false` (each
# has its own `fn main`). They are deliberately NOT part of the CI gates; run
# them by hand when touching the response pipeline:
#   cargo bench --bench response_pipeline    # allocation + timing per stage
#   cargo bench --bench toon_encode_loop     # tight loop to attach a profiler to
[[bench]]
name    = "response_pipeline"
harness = false

[[bench]]
name    = "toon_encode_loop"
harness = false

[profile.bench]
inherits      = "release"
lto           = false
codegen-units = 16
debug         = true
strip         = false

[profile.release]
lto              = "thin"
codegen-units    = 1
strip            = "symbols"
opt-level        = 3

[lints.rust]
# `deny` (not `forbid`), so individual test files that need to mutate
# `std::env` (which became `unsafe` in the 2024 edition) can opt in via
# `#![allow(unsafe_code)]`. Production code never opts in.
unsafe_code = "deny"

[lints.clippy]
all           = { level = "warn", priority = -1 }
pedantic      = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
